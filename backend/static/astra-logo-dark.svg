<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220" role="img" aria-label="ASTRA - Automated Software Testing">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="chk-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="word-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <g transform="translate(10,10)">
    <rect width="200" height="200" rx="48" fill="url(#bg-dark)"/>
    <!-- orbit ring -->
    <circle cx="100" cy="100" r="82" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>
    <circle cx="170" cy="58" r="7" fill="#FDE047"/>
    <circle cx="32" cy="146" r="5" fill="#fff" fill-opacity="0.8"/>
    <!-- star -->
    <path d="M100 26 L113 87 L174 100 L113 113 L100 174 L87 113 L26 100 L87 87 Z" fill="#fff"/>
    <!-- check mark -->
    <path d="M70 102 L91 124 L132 74" fill="none" stroke="url(#chk-dark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="244" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="8" fill="url(#word-dark)">ASTRA</text>
  <rect x="248" y="150" width="64" height="6" rx="3" fill="url(#chk-dark)"/>
  <text x="246" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5" fill="#CBD5E1">AUTOMATED SOFTWARE TESTING</text>
</svg>
