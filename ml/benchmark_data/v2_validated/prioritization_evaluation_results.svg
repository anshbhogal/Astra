<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" style="background:#0f172a; font-family:Inter,system-ui,sans-serif;">
  <!-- Header -->
  <text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="700">ASTRA ML Test Prioritizer — Empirical Benchmark Evaluation</text>
  <text x="30" y="60" fill="#94a3b8" font-size="12">Evaluated on 10 Chronological Test Cycles (4 Microservices, 50 Injected Faults)</text>

  <!-- Panel 1: APFD Bar Comparison -->
  <rect x="30" y="80" width="380" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="112" fill="#e2e8f0" font-size="15" font-weight="600">Average Percentage of Faults Detected (APFD)</text>
  <text x="50" y="130" fill="#94a3b8" font-size="11">Higher score = Earlier fault discovery</text>

  <!-- Bar 1: Random -->
  <text x="50" y="175" fill="#94a3b8" font-size="13">Random Baseline (10 Seeds)</text>
  <rect x="50" y="185" width="149.1" height="28" rx="4" fill="#64748b"/>
  <text x="204.1" y="204" fill="#f8fafc" font-size="13" font-weight="600">0.4969 (±0.042)</text>

  <!-- Bar 2: Heuristic -->
  <text x="50" y="245" fill="#94a3b8" font-size="13">Deterministic Risk-First Heuristic</text>
  <rect x="50" y="255" width="251.8" height="28" rx="4" fill="#38bdf8"/>
  <text x="306.9" y="274" fill="#f8fafc" font-size="13" font-weight="600">0.8395 (±0.147)</text>

  <!-- Bar 3: XGBoost -->
  <text x="50" y="315" fill="#38bdf8" font-size="13" font-weight="600">ASTRA XGBoost Prioritizer (Ours)</text>
  <rect x="50" y="325" width="272.1" height="28" rx="4" fill="#4f46e5"/>
  <text x="327.1" y="344" fill="#f8fafc" font-size="13" font-weight="700">0.9071 (±0.074)</text>

  <!-- Metrics Callout Box -->
  <rect x="50" y="375" width="340" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="396" fill="#10b981" font-size="13" font-weight="600">APFD Improvement: +41.0% vs Random | +6.8% vs Heuristic</text>
  <text x="65" y="412" fill="#94a3b8" font-size="11">Time to 100% faults: 1150.8ms (XGB) vs 1706.2ms (Heur)</text>

  <!-- Panel 2: Fault Detection Cumulative Curve -->
  <rect x="440" y="80" width="410" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="460" y="112" fill="#e2e8f0" font-size="15" font-weight="600">Cumulative Fault Detection vs Suite Executed</text>
  <text x="460" y="130" fill="#94a3b8" font-size="11">Steeper curve = faster early fault discovery</text>

  <!-- Curve Axes -->
  <line x1="480" y1="380" x2="810" y2="380" stroke="#475569" stroke-width="1"/>
  <line x1="480" y1="380" x2="480" y2="160" stroke="#475569" stroke-width="1"/>
  <text x="800" y="398" fill="#64748b" font-size="10">100% Tests</text>
  <text x="480" y="398" fill="#64748b" font-size="10">0%</text>
  <text x="450" y="165" fill="#64748b" font-size="10">100%</text>
  <text x="450" y="270" fill="#64748b" font-size="10">50%</text>
  <text x="450" y="380" fill="#64748b" font-size="10">0%</text>
  <polyline points="480,380 513.0,359.3 546.0,338.4 579.0,304.8 612.0,279.0 645.0,268.9 678.0,249.3 711.0,234.4 744.0,213.0 777.0,186.4 810.0,160.0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  <polyline points="480,380 513.0,219.0 546.0,191.9 579.0,191.9 612.0,186.4 645.0,182.7 678.0,182.7 711.0,182.7 744.0,182.7 777.0,182.7 810.0,160.0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <polyline points="480,380 513.0,191.9 546.0,188.2 579.0,179.1 612.0,173.6 645.0,169.2 678.0,165.5 711.0,160.0 744.0,160.0 777.0,160.0 810.0,160.0" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <!-- Legend -->
  <circle cx="490" cy="415" r="4" fill="#4f46e5"/>
  <text x="500" y="418" fill="#e2e8f0" font-size="11">ASTRA XGBoost</text>
  <circle cx="610" cy="415" r="4" fill="#38bdf8"/>
  <text x="620" y="418" fill="#e2e8f0" font-size="11">Heuristic Baseline</text>
  <circle cx="735" cy="415" r="4" fill="#64748b"/>
  <text x="745" y="418" fill="#e2e8f0" font-size="11">Random (10 Seeds)</text>
</svg>